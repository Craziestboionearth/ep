<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europäisches Parlament 2024-2029</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Container hält die Proportionen der Originalgrafik bei */
        .presentation-box {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 1.1 / 1; /* Angepasst an das fast quadratische Format der Grafik */
            background-color: #ffffff;
            overflow: hidden;
        }

        /* Zentrierter Text wie in der Vorlage */
        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
            width: 100%;
        }

        .center-text .total-seats {
            font-size: 2.5vw;
            font-weight: bold;
            color: #000;
            margin-bottom: 7vw; /* Platz für das Halbrund */
        }

        .center-text h1 {
            font-size: 3vw;
            margin: 0;
            color: #000;
            font-weight: 800;
        }

        .center-text h2 {
            font-size: 2.2vw;
            margin: 5px 0 15px 0;
            color: #000;
            font-weight: normal;
        }

        .center-text p {
            font-size: 1.2vw;
            color: #000;
            margin: 2px 0;
        }

        /* Gepunktetes Halbrund (simuliert die Sitze) */
        .hemicycle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55%;
            height: 55%;
            z-index: 1;
        }

        /* Interaktive Fraktions-Boxen */
        .party-box {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Initialer Zustand: Kleiner farbiger Punkt */
        .box-trigger {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--bg-color);
            border: 2px solid var(--border-color, var(--bg-color));
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color, white);
            font-weight: bold;
            font-size: 14px;
        }

        /* Versteckter Inhalt (Sitzzahl + Logo) */
        .box-content {
            position: absolute;
            width: 120px;
            height: 120px;
            background-color: var(--bg-color);
            border: 2px solid var(--border-color, var(--bg-color));
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        /* Layout innerhalb der entfalteten Karte */
        .box-content .seats {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            font-size: 32px;
            font-weight: 900;
            color: var(--text-color, white);
            padding-bottom: 5px;
        }

        .box-content .logo-area {
            flex: 1;
            background-color: var(--logo-bg, transparent);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .box-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Hover-Effekte */
        .party-box:hover { z-index: 20; }
        .party-box:hover .box-trigger { opacity: 0; transform: scale(0); }
        .party-box:hover .box-content { opacity: 1; transform: scale(1); pointer-events: auto; }

        /* --- FRAKTIONEN: Farben & Exakte Positionen analog zur Grafik --- */

        /* Renew: Oben Links */
        .f-renew { top: 12%; left: 28%; --bg-color: #0087dc; }

        /* Greens: Mitte Links */
        .f-greens { top: 25%; left: 16%; --bg-color: #2b8a3e; }

        /* S&D: Unten Links */
        .f-sd { top: 52%; left: 12%; --bg-color: #e3001b; }

        /* The Left: Ganz unten Links (Weißer Hintergrund, Rote Schrift) */
        .f-left { top: 75%; left: 20%; --bg-color: #ffffff; --border-color: #999; --text-color: #c92a2a; }

        /* EPP: Oben Rechts */
        .f-epp { top: 10%; left: 62%; --bg-color: #003399; }

        /* ECR: Mitte Rechts */
        .f-ecr { top: 30%; left: 82%; --bg-color: #004a99; }

        /* Patriots: Unten Mitte Rechts */
        .f-patriots { top: 52%; left: 82%; --bg-color: #1c355e; }

        /* ESN: Unten Rechts */
        .f-esn { top: 70%; left: 80%; --bg-color: #152e4d; }

        /* NI: Ganz unten Rechts (Grau) */
        .f-ni { top: 80%; left: 70%; --bg-color: #777777; }

        @media (max-width: 800px) {
            .box-content { width: 90px; height: 90px; }
            .box-content .seats { font-size: 24px; }
            .center-text h1 { font-size: 4vw; }
            .center-text h2 { font-size: 3vw; }
        }
    </style>
</head>
<body>

    <div class="presentation-box">

        <!-- Gepunktetes Halbrund (Zentrum) -->
        <svg class="hemicycle" viewBox="0 0 100 50">
            <!-- Mehrere Halbkreise, gestrichelt, um die Sitze anzudeuten -->
            <path d="M 10,50 A 40,40 0 0,1 90,50" fill="none" stroke="#d3d3d3" stroke-width="3" stroke-dasharray="1 3" stroke-linecap="round"/>
            <path d="M 20,50 A 30,30 0 0,1 80,50" fill="none" stroke="#a9a9a9" stroke-width="4" stroke-dasharray="1 3.5" stroke-linecap="round"/>
            <path d="M 30,50 A 20,20 0 0,1 70,50" fill="none" stroke="#808080" stroke-width="5" stroke-dasharray="1 4" stroke-linecap="round"/>
        </svg>

        <!-- Zentraler Textblock -->
        <div class="center-text">
            <div class="total-seats">720<br>Sitze</div>
            <h1>Europäisches Parlament</h1>
            <h2>2024–2029</h2>
            <p>Konstituierende Sitzung</p>
            <p>am 16. Juli 2024</p>
        </div>

        <!-- LINKER FLÜGEL -->
        <div class="party-box f-renew">
            <div class="box-trigger">RE</div>
            <div class="box-content">
                <div class="seats">77</div>
                <div class="logo-area"><img src="assets/reneweurope.png" alt="Renew Europe"></div>
            </div>
        </div>

        <div class="party-box f-greens">
            <div class="box-trigger">GR</div>
            <div class="box-content">
                <div class="seats">53</div>
                <div class="logo-area"><img src="assets/greensefa.png" alt="Greens/EFA"></div>
            </div>
        </div>

        <div class="party-box f-sd">
            <div class="box-trigger">S&D</div>
            <div class="box-content">
                <div class="seats">136</div>
                <div class="logo-area"><img src="assets/sd.png" alt="S&D"></div>
            </div>
        </div>

        <div class="party-box f-left">
            <div class="box-trigger">LEFT</div>
            <div class="box-content">
                <div class="seats">46</div>
                <div class="logo-area"><img src="assets/theleft.png" alt="The Left"></div>
            </div>
        </div>

        <!-- RECHTER FLÜGEL -->
        <div class="party-box f-epp">
            <div class="box-trigger">EPP</div>
            <div class="box-content">
                <div class="seats">188</div>
                <div class="logo-area"><img src="assets/epp.png" alt="EPP"></div>
            </div>
        </div>

        <div class="party-box f-ecr">
            <div class="box-trigger">ECR</div>
            <div class="box-content">
                <div class="seats">78</div>
                <div class="logo-area"><img src="assets/ecr.png" alt="ECR"></div>
            </div>
        </div>

        <div class="party-box f-patriots">
            <div class="box-trigger">PAT</div>
            <div class="box-content">
                <div class="seats">84</div>
                <div class="logo-area"><img src="assets/patriots.png" alt="Patriots for Europe"></div>
            </div>
        </div>

        <div class="party-box f-esn">
            <div class="box-trigger">ESN</div>
            <div class="box-content">
                <div class="seats">25</div>
                <div class="logo-area"><img src="assets/esn.png" alt="ESN"></div>
            </div>
        </div>

        <div class="party-box f-ni">
            <div class="box-trigger">NI</div>
            <div class="box-content" style="--logo-bg: white;">
                <div class="seats">32</div>
                <div class="logo-area"><img src="assets/nofraction.png" alt="Fraktionslos"></div>
            </div>
        </div>

    </div>

</body>
</html>
