<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europäisches Parlament 2024-2029</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #ffffff;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 200 / 120;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Das neue Panel für die deutschen Parteien am linken Rand */
        .german-panel {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 220px;
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .german-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .party-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .party-item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: #ffffff; /* Weißer Hintergrund für transparente Logos */
            border-radius: 6px;
            padding: 2px;
        }

        .party-item span {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }

        .no-parties {
            font-size: 14px;
            color: #888;
            font-style: italic;
        }

        /* SVG Styling */
        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .faction-path {
            stroke: #121212;
            stroke-width: 1.5;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), stroke-width 0.2s;
            transform-origin: 100px 105px;
            cursor: pointer;
        }

        .faction-path:hover {
            transform: scale(1.08);
            stroke-width: 0.5;
            z-index: 10;
        }

        /* Zentraler Text */
        .center-text {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }

        .center-text .seats {
            font-size: 1vw;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
            line-height: 1;
        }

        .center-text h1 {
            font-size: 2.2vw;
            margin: 10px 0 0 0;
            color: #ffffff;
        }

        .center-text h2 {
            font-size: 1.8vw;
            margin: 0;
            color: #aaaaaa;
            font-weight: normal;
        }

        /* Tooltip an der Grafik */
        .tooltip {
            position: absolute;
            background: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
            min-width: 120px;
            border: 2px solid #333;
        }

        .tooltip img {
            max-width: 100px;
            max-height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .tooltip .tt-seats {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
        }

        .tooltip .tt-label {
            font-size: 12px;
            text-transform: uppercase;
            color: #888888;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Linkes Panel für deutsche Parteien -->
    <div class="german-panel" id="german-panel">
        <h3>Deutsche Parteien</h3>
        <div id="german-party-list"></div>
    </div>

    <div class="chart-container">
        <svg viewBox="0 0 200 120" id="hemicycle"></svg>

        <div class="center-text">
            <div class="seats">720<br>Sitze</div>
            <h1>Europäisches Parlament</h1>
            <h2>2024–2029</h2>
        </div>

        <div class="tooltip" id="tooltip">
            <img id="tt-img" src="" alt="Logo">
            <div class="tt-seats" id="tt-seats">0</div>
            <div class="tt-label">Sitze</div>
        </div>
    </div>

    <script>
        const factions = [
            {
                id: 'left', seats: 46, color: '#c92a2a', file: 'assets/theleft.png',
                germanParties: [
                    { name: 'Die Linke', img: 'assets/dielinke.png' },
                    { name: 'Tierschutzpartei', img: 'assets/tierschutzpartei.png' }
                ]
            },
            {
                id: 'sd', seats: 136, color: '#e3001b', file: 'assets/sd.png',
                germanParties: [
                    { name: 'SPD', img: 'assets/spd.png' }
                ]
            },
            {
                id: 'greens', seats: 53, color: '#2b8a3e', file: 'assets/greensefa.png',
                germanParties: [
                    { name: 'Grüne', img: 'assets/gruene.png' },
                    { name: 'Volt', img: 'assets/volt.png' }
                ]
            },
            {
                id: 'renew', seats: 77, color: '#0087dc', file: 'assets/reneweurope.png',
                germanParties: [
                    { name: 'FDP', img: 'assets/fdp.png' },
                    { name: 'Freie Wähler', img: 'assets/freiewaehler.png' }
                ]
            },
            {
                id: 'epp', seats: 188, color: '#003399', file: 'assets/epp.png',
                germanParties: [
                    { name: 'CDU', img: 'assets/cdu.png' },
                    { name: 'CSU', img: 'assets/csu.png' },
                    { name: 'ÖDP', img: 'assets/oedp.png' },
                    { name: 'Familienpartei', img: 'assets/familienpartei.png' }
                ]
            },
            {
                id: 'ecr', seats: 78, color: '#004a99', file: 'assets/ecr.png',
                germanParties: []
            },
            {
                id: 'patriots', seats: 84, color: '#1c355e', file: 'assets/patriots.png',
                germanParties: []
            },
            {
                id: 'esn', seats: 25, color: '#152e4d', file: 'assets/esn.png',
                germanParties: [
                    { name: 'AfD', img: 'assets/afd.png' }
                ]
            },
            {
                id: 'ni', seats: 32, color: '#777777', file: 'assets/nofraction.png',
                germanParties: [
                    { name: 'BSW', img: 'assets/bsw.png' },
                    { name: 'Die PARTEI', img: 'assets/diepartei.png' },
                    { name: 'PdF', img: 'assets/pdf.png' }
                ]
            }
        ];

        const totalSeats = 720;
        const svg = document.getElementById('hemicycle');
        const tooltip = document.getElementById('tooltip');
        const ttImg = document.getElementById('tt-img');
        const ttSeats = document.getElementById('tt-seats');

        const germanPanel = document.getElementById('german-panel');
        const germanPartyList = document.getElementById('german-party-list');

        const cx = 100;
        const cy = 105;
        const radiusOuter = 95;
        const radiusInner = 45;

        function getCoordinates(percent, radius) {
            const angle = Math.PI - (percent * Math.PI);
            return {
                x: cx + Math.cos(angle) * radius,
                y: cy - Math.sin(angle) * radius
            };
        }

        let cumulativePercent = 0;

        factions.forEach(faction => {
            const percent = faction.seats / totalSeats;
            const startPercent = cumulativePercent;
            const endPercent = cumulativePercent + percent;
            cumulativePercent += percent;

            const middlePercent = startPercent + (percent / 2);
            const middleAngle = Math.PI - (middlePercent * Math.PI);

            const anchorRadius = radiusOuter + 5;
            const anchorX = cx + Math.cos(middleAngle) * anchorRadius;
            const anchorY = cy - Math.sin(middleAngle) * anchorRadius;

            const tooltipLeft = (anchorX / 200) * 100;
            const tooltipTop = (anchorY / 120) * 100;

            const startOuter = getCoordinates(startPercent, radiusOuter);
            const endOuter = getCoordinates(endPercent, radiusOuter);
            const startInner = getCoordinates(startPercent, radiusInner);
            const endInner = getCoordinates(endPercent, radiusInner);

            const pathData = [
                `M ${startOuter.x} ${startOuter.y}`,
                `A ${radiusOuter} ${radiusOuter} 0 0 1 ${endOuter.x} ${endOuter.y}`,
                `L ${endInner.x} ${endInner.y}`,
                `A ${radiusInner} ${radiusInner} 0 0 0 ${startInner.x} ${startInner.y}`,
                `Z`
            ].join(' ');

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', pathData);
            path.setAttribute('fill', faction.color);
            path.setAttribute('class', 'faction-path');

            path.addEventListener('mouseenter', () => {
                // Zentrales Tooltip konfigurieren
                ttImg.src = faction.file;
                ttSeats.textContent = faction.seats;
                tooltip.style.borderColor = faction.color;

                tooltip.style.left = `${tooltipLeft}%`;
                tooltip.style.top = `${tooltipTop}%`;

                let transformBase = "";
                if (tooltipLeft < 50) {
                    transformBase = "translate(-110%, -50%)";
                } else {
                    transformBase = "translate(10%, -50%)";
                }

                tooltip.style.transform = `${transformBase} scale(0.8)`;

                // Linkes Panel für deutsche Parteien konfigurieren
                germanPanel.style.borderColor = faction.color;
                germanPartyList.innerHTML = '';

                if (faction.germanParties.length > 0) {
                    faction.germanParties.forEach(party => {
                        const div = document.createElement('div');
                        div.className = 'party-item';
                        div.innerHTML = `<img src="${party.img}" alt="${party.name}"><span>${party.name}</span>`;
                        germanPartyList.appendChild(div);
                    });
                } else {
                    germanPartyList.innerHTML = '<span class="no-parties">Keine Abgeordneten aus Deutschland.</span>';
                }

                // Animationen starten
                requestAnimationFrame(() => {
                    tooltip.style.opacity = '1';
                    tooltip.style.transform = `${transformBase} scale(1)`;
                    germanPanel.style.opacity = '1';
                });
            });

            path.addEventListener('mouseleave', () => {
                tooltip.style.opacity = '0';
                germanPanel.style.opacity = '0';
                const currentTransform = tooltip.style.transform.replace('scale(1)', 'scale(0.8)');
                tooltip.style.transform = currentTransform;
            });

            svg.appendChild(path);
        });
    </script>

</body>
</html>
