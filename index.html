<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europäisches Parlament 2024-2029</title>
    <style>
        /* Reset und Grundeinstellungen */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Ideal für PowerPoint Einbettung */
        }

        /*
         * Container im 16:9 Format für Präsentationen.
         * Dadurch bleiben die Positionen immer im perfekten Verhältnis.
         */
        .presentation-box {
            position: relative;
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* Dekorative Halbkreise im Hintergrund (deutet die Sitze an) */
        .hemicycle-bg {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 55%;
            z-index: 0;
            opacity: 0.6;
        }

        /* Text in der Mitte der Grafik */
        .center-info {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 1;
        }

        .center-info h1 {
            margin: 0;
            font-size: 2.2vw;
            color: #000;
        }

        .center-info h2 {
            margin: 0;
            font-size: 1.8vw;
            color: #333;
            font-weight: normal;
        }

        .center-info p {
            margin: 10px 0 0 0;
            font-size: 1.5vw;
            font-weight: bold;
            color: #555;
        }

        /* Einzelne Fraktions-Punkte (geschlossener Zustand) */
        .fraction-node {
            position: absolute;
            width: 5vw;
            height: 5vw;
            min-width: 50px;
            min-height: 50px;
            border-radius: 50%;
            background-color: var(--f-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transform: translate(-50%, -50%);
            z-index: 5;
            border: 2px solid white;
        }

        /* Geschlossener Text (Kürzel) */
        .node-closed {
            font-weight: bold;
            font-size: 1.2vw;
            transition: opacity 0.2s;
            text-align: center;
        }

        /* Hover-Effekt: Box vergrößert sich zu einem Rechteck */
        .fraction-node:hover {
            width: 14vw;
            height: 9vw;
            min-width: 150px;
            min-height: 100px;
            border-radius: 12px;
            z-index: 20;
            background-color: white;
            border: 4px solid var(--f-color);
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        .fraction-node:hover .node-closed {
            opacity: 0;
            position: absolute;
            pointer-events: none;
        }

        /* Offener Zustand (Logo + Sitze) */
        .node-open {
            opacity: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: absolute;
            transform: scale(0.8);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .fraction-node:hover .node-open {
            opacity: 1;
            transform: scale(1);
            transition-delay: 0.1s;
        }

        .node-open img {
            max-width: 80%;
            max-height: 50%;
            object-fit: contain;
            margin-bottom: 5px;
        }

        .node-open .seats {
            font-size: 1.8vw;
            font-weight: 900;
            color: var(--f-color);
            line-height: 1;
        }

        .node-open .label {
            font-size: 0.9vw;
            color: #666;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Farben basierend auf der Grafik */
        .f-left { --f-color: #c92a2a; top: 70%; left: 18%; }
        .f-sd { --f-color: #f0001c; top: 45%; left: 20%; }
        .f-greens { --f-color: #2b8a3e; top: 20%; left: 32%; }
        .f-renew { --f-color: #0087dc; top: 12%; left: 45%; }
        .f-epp { --f-color: #003399; top: 12%; left: 58%; }
        .f-ecr { --f-color: #00008b; top: 20%; left: 72%; }
        .f-patriots { --f-color: #1c355e; top: 45%; left: 82%; }
        .f-esn { --f-color: #152e4d; top: 70%; left: 85%; }
        .f-ni { --f-color: #868e96; top: 85%; left: 73%; }

        @media (max-width: 800px) {
            .node-closed { font-size: 14px; }
            .node-open .seats { font-size: 20px; }
            .node-open .label { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="presentation-box">

        <!-- Dekoratives Halbrund im Hintergrund (erzeugt den Sitz-Look) -->
        <svg class="hemicycle-bg" viewBox="0 0 100 50">
            <path d="M 5,50 A 45,45 0 0,1 95,50" fill="none" stroke="#e9ecef" stroke-width="6" stroke-dasharray="1 2" stroke-linecap="round"/>
            <path d="M 15,50 A 35,35 0 0,1 85,50" fill="none" stroke="#dee2e6" stroke-width="8" stroke-dasharray="1 2.5" stroke-linecap="round"/>
            <path d="M 25,50 A 25,25 0 0,1 75,50" fill="none" stroke="#ced4da" stroke-width="10" stroke-dasharray="1 3" stroke-linecap="round"/>
        </svg>

        <!-- Zentrale Information -->
        <div class="center-info">
            <h1>Europäisches Parlament</h1>
            <h2>2024–2029</h2>
            <p>720 Sitze</p>
        </div>

        <!-- Fraktionen -->
        <div class="fraction-node f-left">
            <div class="node-closed">LEFT</div>
            <div class="node-open">
                <img src="assets/theleft.png" alt="The Left">
                <div class="seats">46</div>
                <div class="label">Sitze</div>
            </div>
        </div>

        <div class="fraction-node f-sd">
            <div class="node-closed">S&D</div>
            <div class="node-open">
                <img src="assets/sd.png" alt="S&D">
                <div class="seats">136</div>
                <div class="label">Sitze</div>
            </div>
        </div>

        <div class="fraction-node f-greens">
            <div class="node-closed">Grüne</div>
            <div class="node-open">
                <img src="assets/greensefa.png" alt="Greens/EFA">
                <div class="seats">53</div>
                <div class="label">Sitze</div>
            </div>
        </div>

        <div class="fraction-node f-renew">
            <div class="node-closed">Renew</div>
            <div class="node-open">
                <img src="assets/reneweurope.png" alt="Renew Europe">
                <div class="seats">77</div>
                <div class="label">Sitze</div>
            </div>
        </div>

        <div class="fraction-node f-epp">
            <div class="node-closed">EPP</div>
            <div class="node-open">
                <!-- WICHTIG: Die epp.png fehlte in Ihrer Aufzählung! Bitte hinzufügen. -->
                <img src="assets/epp.png" alt="EPP">
                <div class="seats">188</div>
                <div class="label">Sitze</div>
            </div>
        </div>

        <div class="fraction-node f-ecr">
            <div class="node-closed">ECR</div>
            <div class="node-open">
                <img src="assets/ecr.png" alt="ECR">
                <div class="seats">78</div>
                <div class="label">Sitze</div>
            </div>
        </div>

        <div class="fraction-node f-patriots">
            <div class="node-closed">Patriots</div>
            <div class="node-open">
                <img src="assets/patriots.png" alt="Patriots for Europe">
                <div class="seats">84</div>
                <div class="label">Sitze</div>
            </div>
        </div>

        <div class="fraction-node f-esn">
            <div class="node-closed">ESN</div>
            <div class="node-open">
                <img src="assets/esn.png" alt="ESN">
                <div class="seats">25</div>
                <div class="label">Sitze</div>
            </div>
        </div>

        <div class="fraction-node f-ni">
            <div class="node-closed">NI</div>
            <div class="node-open">
                <img src="assets/nofraction.png" alt="Fraktionslos">
                <div class="seats">32</div>
                <div class="label">Fraktionslos</div>
            </div>
        </div>

    </div>

</body>
</html>
