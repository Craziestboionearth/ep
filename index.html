<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europäisches Parlament 2024-2029</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVG Styling */
        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .faction-path {
            stroke: #ffffff;
            stroke-width: 1.5;
            transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-origin: 100px 105px; /* Zentrum des Halbkreises im viewBox */
            cursor: pointer;
        }

        /* Der Zoom-Effekt beim Hovern */
        .faction-path:hover {
            transform: scale(1.08);
            stroke-width: 0.5;
            z-index: 10;
        }

        /* Zentraler statischer Text */
        .center-text {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }

        .center-text .seats {
            font-size: 3vw;
            font-weight: bold;
            color: #000;
            margin-bottom: 5px;
            line-height: 1;
        }

        .center-text h1 {
            font-size: 2.2vw;
            margin: 10px 0 0 0;
            color: #000;
        }

        .center-text h2 {
            font-size: 1.8vw;
            margin: 0;
            color: #333;
            font-weight: normal;
        }

        /* Tooltip (erscheint beim Hovern über einen Kreisabschnitt) */
        .tooltip {
            position: fixed;
            top: -1000px;
            left: -1000px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 100;
            min-width: 120px;
            border: 2px solid #eee;
        }

        .tooltip img {
            max-width: 100px;
            max-height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .tooltip .tt-seats {
            font-size: 24px;
            font-weight: 900;
            color: #333;
        }

        .tooltip .tt-label {
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="chart-container">
        <!-- SVG Container für die Kreisabschnitte -->
        <svg viewBox="0 0 200 120" id="hemicycle"></svg>

        <div class="center-text">
            <div class="seats">720<br>Sitze</div>
            <h1>Europäisches Parlament</h1>
            <h2>2024–2029</h2>
        </div>
    </div>

    <!-- Das interaktive Overlay -->
    <div class="tooltip" id="tooltip">
        <img id="tt-img" src="" alt="Logo">
        <div class="tt-seats" id="tt-seats">0</div>
        <div class="tt-label">Sitze</div>
    </div>

    <script>
        // Daten der Fraktionen (Reihenfolge von Links nach Rechts)
        const factions = [
            { id: 'left', seats: 46, color: '#c92a2a', file: 'assets/theleft.png' },
            { id: 'sd', seats: 136, color: '#e3001b', file: 'assets/sd.png' },
            { id: 'greens', seats: 53, color: '#2b8a3e', file: 'assets/greensefa.png' },
            { id: 'renew', seats: 77, color: '#0087dc', file: 'assets/reneweurope.png' },
            { id: 'epp', seats: 188, color: '#003399', file: 'assets/epp.png' },
            { id: 'ecr', seats: 78, color: '#004a99', file: 'assets/ecr.png' },
            { id: 'patriots', seats: 84, color: '#1c355e', file: 'assets/patriots.png' },
            { id: 'esn', seats: 25, color: '#152e4d', file: 'assets/esn.png' },
            { id: 'ni', seats: 32, color: '#777777', file: 'assets/nofraction.png' }
        ];

        const totalSeats = 720;
        const svg = document.getElementById('hemicycle');
        const tooltip = document.getElementById('tooltip');
        const ttImg = document.getElementById('tt-img');
        const ttSeats = document.getElementById('tt-seats');

        // Parameter für die Kreisberechnung
        const cx = 100; // Zentrum X
        const cy = 105; // Zentrum Y (leicht nach unten versetzt)
        const radiusOuter = 95; // Äußerer Radius
        const radiusInner = 45; // Innerer Radius

        // Hilfsfunktion: Berechnet X/Y Koordinaten auf Basis eines Prozentwerts (0 bis 1) des Halbkreises
        function getCoordinates(percent, radius) {
            // PI (180 Grad) ist links, 0 ist rechts
            const angle = Math.PI - (percent * Math.PI);
            return {
                x: cx + Math.cos(angle) * radius,
                y: cy - Math.sin(angle) * radius
            };
        }

        let cumulativePercent = 0;

        // Generiere die SVG-Pfade für jede Fraktion
        factions.forEach(faction => {
            const percent = faction.seats / totalSeats;
            const startPercent = cumulativePercent;
            const endPercent = cumulativePercent + percent;
            cumulativePercent += percent;

            // Start- und Endpunkte für den äußeren und inneren Bogen
            const startOuter = getCoordinates(startPercent, radiusOuter);
            const endOuter = getCoordinates(endPercent, radiusOuter);
            const startInner = getCoordinates(startPercent, radiusInner);
            const endInner = getCoordinates(endPercent, radiusInner);

            // SVG Path Syntax (M = Move, A = Arc, L = Line, Z = Close)
            const pathData = [
                `M ${startOuter.x} ${startOuter.y}`,
                `A ${radiusOuter} ${radiusOuter} 0 0 1 ${endOuter.x} ${endOuter.y}`,
                `L ${endInner.x} ${endInner.y}`,
                `A ${radiusInner} ${radiusInner} 0 0 0 ${startInner.x} ${startInner.y}`,
                `Z`
            ].join(' ');

            // Pfad-Element erstellen
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', pathData);
            path.setAttribute('fill', faction.color);
            path.setAttribute('class', 'faction-path');

            // Hover-Events für den Tooltip hinzufügen
            path.addEventListener('mouseenter', () => {
                tooltip.style.opacity = '1';
                ttImg.src = faction.file;
                ttSeats.textContent = faction.seats;
                tooltip.style.borderColor = faction.color;
            });

            path.addEventListener('mouseleave', () => {
                tooltip.style.opacity = '0';
            });

            svg.appendChild(path);
        });

        // Tooltip soll der Maus folgen
        document.addEventListener('mousemove', (e) => {
            if (tooltip.style.opacity === '1') {
                // Leichter Versatz nach rechts unten, damit der Cursor das Bild nicht verdeckt
                tooltip.style.left = (e.pageX + 15) + 'px';
                tooltip.style.top = (e.pageY + 15) + 'px';
            }
        });
    </script>

</body>
</html>
